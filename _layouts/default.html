<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  {% feed_meta %}
  {% seo %}
  <style>
    /* Base */
    body {
      font-family: 'Source Sans Pro', Helvetica, Arial, sans-serif;
      font-size: 20px;
      color: #333;
      margin: 0;
      padding: 0;
    }
    a { color: #286090; }
    a:hover { color: #1a3f5e; text-decoration: none; }

    /* Navbar */
    nav.site-nav {
      background: rgba(0, 0, 0, 0.5);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 12px 0;
    }
    nav.site-nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav.site-nav .navbar-brand {
      font-weight: 800;
      font-size: 22px;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    nav.site-nav .navbar-brand:hover { color: #f0f0f0; }
    nav.site-nav .nav-links a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    nav.site-nav .nav-links a:hover { color: #ddd; }

    /* Header */
    header.site-header {
      background-color: #286090;
      background: linear-gradient(to bottom, #243b55, #141e30);
      color: #fff;
      padding: 150px 0 100px;
      text-align: center;
    }
    header.site-header h1 {
      color: #fff;
      font-weight: 800;
      font-size: 48px;
      margin-bottom: 15px;
    }
    header.site-header h2 {
      color: #f8f8f9;
      font-style: italic;
      font-weight: 300;
      font-size: 24px;
      margin-top: 0;
    }
    header.site-header .post-meta {
      color: #ccc;
      font-style: italic;
      font-size: 18px;
      margin-top: 10px;
    }

    /* Content */
    .post-content {
      max-width: 750px;
      margin: 0 auto;
      padding: 40px 15px;
      line-height: 1.7;
    }
    .post-content h2 { font-weight: 700; margin-top: 40px; }
    .post-content h3 { font-weight: 600; margin-top: 30px; }
    .post-content p { margin-bottom: 20px; }
    .post-content ul, .post-content ol { margin-bottom: 20px; }
    .post-content blockquote {
      border-left: 4px solid #286090;
      padding-left: 20px;
      color: #666;
      font-style: italic;
    }
    .post-content hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 40px 0;
    }
    .post-content img { max-width: 100%; height: auto; }

    /* Post list */
    .post-list {
      max-width: 750px;
      margin: 0 auto;
      padding: 20px 15px 40px;
    }
    .post-list .post-preview {
      padding: 25px 0;
      border-bottom: 1px solid #eee;
    }
    .post-list .post-preview:last-child { border-bottom: none; }
    .post-list .post-preview a { text-decoration: none; color: #333; }
    .post-list .post-preview a:hover { color: #286090; }
    .post-list .post-preview .post-title {
      font-size: 30px;
      font-weight: 700;
      margin: 0 0 5px;
    }
    .post-list .post-preview .post-meta {
      color: #888;
      font-style: italic;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .post-list .post-preview .post-excerpt {
      color: #666;
      font-size: 18px;
      line-height: 1.6;
    }

    /* Footer */
    footer.site-footer {
      padding: 50px 0;
      background-color: #333;
      color: #999;
      text-align: center;
      font-size: 14px;
    }
    footer.site-footer a { color: #ccc; }
    footer.site-footer a:hover { color: #fff; }

    /* Responsive */
    @media (max-width: 768px) {
      header.site-header { padding: 120px 0 60px; }
      header.site-header h1 { font-size: 32px; }
      header.site-header h2 { font-size: 18px; }
      .post-list .post-preview .post-title { font-size: 24px; }
      body { font-size: 18px; }
      nav.site-nav .navbar-brand { font-size: 18px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <div class="container">
      <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </div>
    </div>
  </nav>

  {{ content }}

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
